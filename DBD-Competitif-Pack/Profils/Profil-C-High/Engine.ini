; ====================================================================================
; Dead by Daylight - Profil Compétitif (par Jules)
; PROFIL C : Haute Config (GPU avec 10 à 12 Go de VRAM)
; OBJECTIF : Performance stable, haute qualité des textures, lisibilité parfaite.
; 100% FAIR-PLAY : Aucune modification non autorisée.
; ====================================================================================

[SystemSettings]
; --- Latence et Synchronisation Moteur ---
r.OneFrameThreadLag=0
r.GTSyncType=1

; --- Netteté et Qualité d'Image "Clean" ---
r.SceneColorFringeQuality=0
r.Tonemapper.GrainQuantization=0
r.MotionBlur.Max=0
r.MotionBlurQuality=0
r.LensFlareQuality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.EyeAdaptationQuality=0
r.FilmGrain=0

; --- Post-Process et Réflexions (Coûteux) ---
r.SSR.Quality=0
r.SSR.Temporal=0
r.RefractionQuality=0
r.AmbientOcclusionLevels=0
r.AmbientOcclusionQuality=0
r.LightShaftQuality=0

; --- Ombres ---
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512

; --- Anti-Aliasing ---
r.DefaultFeature.AntiAliasing=0

; --- Filtrage des Textures ---
r.MaxAnisotropy=8
r.MipMapLODBias=0

; --- Streaming des Textures (Dynamique par Profil) ---
r.TextureStreaming=1
r.Streaming.DefragDynamicBounds=1
r.Streaming.UseFixedPoolSize=1
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0
r.Streaming.PoolSize=1536             ; TAILLE DU POOL POUR PROFIL C (1536 Mo). Adapté pour les GPU avec 10-12 Go de VRAM.

; --- CVars Avancées (Légitimes mais à surveiller) ---
r.HZBOcclusion=0
r.FinishCurrentFrame=0
r.SceneColorFormat=3
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.MaxTempMemoryAllowed=50
