; ====================================================================================
; Dead by Daylight - Profil Compétitif (par Jules)
; PROFIL UNIVERSEL
; OBJECTIF : Input brut (Raw Input), sans accélération ni lissage de la souris.
; ====================================================================================

[/Script/Engine.InputSettings]
; --- Paramètres de la Souris ---
; Désactive toute forme de modification de l'input de la souris pour une précision maximale.
bEnableMouseSmoothing=False           ; Désactive le lissage de la souris, qui peut créer une sensation de "flottement".
bViewAccelerationEnabled=False        ; Désactive l'accélération, qui modifie la sensibilité en fonction de la vitesse de mouvement de la souris.

[/Script/DeadByDaylight.DBDInputManager]
; --- Mappages de Touches (Bindings) ---
; Cette section contient vos attributions de touches personnelles.
; Pour éviter d'écraser vos préférences, ce fichier ne contient que les valeurs par défaut pour la souris.
; Le script d'installation ne touchera PAS à vos binds existants s'il en trouve.
;
; EXEMPLE DE REMAP FACULTATIF :
; Si vous vouliez assigner une action à une touche, vous ajouteriez une ligne comme ci-dessous.
; (Ceci est un exemple, ne pas décommenter sauf si vous savez ce que vous faites)
;
; ActionMappings=(ActionName="Interact",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=E)
; ActionMappings=(ActionName="Struggle",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)

; --- Sensibilité ---
; Votre sensibilité est stockée dans un autre fichier de sauvegarde et ne sera pas affectée.
; Vous pouvez la régler en jeu.
LookScale=0.500000
TurnScale=1.000000
