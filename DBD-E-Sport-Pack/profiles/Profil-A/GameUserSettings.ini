; ====================================================================================
; GameUserSettings.ini — Profil A (Très Basse Config)
; Synchronisé avec Engine.ini pour une performance et stabilité maximales.
; ====================================================================================

[/Script/Engine.GameUserSettings]
; --- Paramètres d'affichage principaux ---
bUseVSync=False                       ; Indispensable : Désactive la V-Sync du jeu pour minimiser la latence.
FullscreenMode=1                      ; Recommandé : Force le mode Fenêtré Plein Écran pour la stabilité (0=Plein Écran, 1=Fenêtré PE).
PreferredFullscreenMode=1             ; Confirme la préférence pour le Fenêtré Plein Écran.
FrameRateLimit=0.000000               ; Essentiel : Supprime la limite d'images par seconde du jeu.
bUseDynamicResolution=False           ; Désactive la résolution dynamique qui peut flouter l'image.

; --- Résolution (Placeholder) ---
; Le script d'installation remplacera ces valeurs par la résolution native de l'utilisateur.
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080

[ScalabilityGroups]
; --- Groupes de qualité graphique (Scalability) ---
; Niveaux réglés pour correspondre aux cvars de Engine.ini et assurer la performance.
sg.ResolutionQuality=100.000000
sg.ViewDistanceQuality=1              ; Distance d'affichage (1 = Moyenne). Un bon compromis visibilité/perf.
sg.AntiAliasingQuality=0              ; Anti-aliasing au minimum (0 = Bas/FXAA).
sg.ShadowQuality=0                    ; Ombres au minimum (0 = Bas). Doit correspondre à Engine.ini.
sg.GlobalIlluminationQuality=0        ; Illumination globale désactivée (très coûteux).
sg.ReflectionQuality=0                ; Reflets désactivés (très coûteux).
sg.PostProcessQuality=0               ; Post-traitement au minimum (0 = Bas). Doit correspondre à Engine.ini.
sg.TextureQuality=0                   ; PROFIL A: Qualité des textures (0 = Basse).
sg.EffectsQuality=0                   ; Qualité des effets (0 = Bas).
sg.FoliageQuality=0                   ; Qualité de la végétation (0 = Bas).
sg.ShadingQuality=0                   ; Qualité du shading (0 = Bas).
sg.AnimationQuality=1                 ; Qualité des animations (1 = Moyenne), impact mineur.

[/Script/DeadByDaylight.DBDGameUserSettings]
; Les préférences personnelles (FOV, Sensibilité, etc.) de cette section
; ne sont pas incluses dans ce modèle. Le script d'installation tentera de
; les préserver depuis votre fichier existant.
Crossplay=True
MuteOnFocusLoss=True
TerrorRadiusVisualFeedback=True       ; Aide à l'accessibilité importante à conserver.
