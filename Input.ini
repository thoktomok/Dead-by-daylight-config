; ============================================================================
;  Input.ini  -  Dead by Daylight (PC)
; ----------------------------------------------------------------------------
;  Disposition clavier : AZERTY (Français)
;  Profil : ZQSD natif, sprint sur LeftShift, accroupi sur LeftControl
;
;  CORRECTIONS PAR RAPPORT AU FICHIER D'ORIGINE :
;    [!] La touche Q était utilisée pour 5 actions distinctes
;        (MoveRightSurvivor, MoveUp, MoveRightKiller, PushToTalk, Cheat).
;        -> PushToTalk déplacé sur V (libre, à portée du pouce).
;        -> Cheat désactivé (laissé sur Q sans effet en retail build mais
;           on évite la collision visuelle ; commenté ici, BHVR le filtre).
;        -> MoveUp (drone/spectateur) laissé sur Q : aucun conflit en match.
;
;    [!] EventAbility_Killer était sur ThumbMouseButton2, en conflit avec
;        Gesture02. -> EventAbility_Killer déplacé sur ThumbMouseButton1.
;
;    [!] Sections regroupées : AXES, SURVIVOR, KILLER, GESTES, UI.
;    [!] Commentaires inline pour chaque bind.
;
;  Emplacement Windows :
;    %LOCALAPPDATA%\DeadByDaylight\Saved\Config\WindowsNoEditor\Input.ini
; ============================================================================


[/Script/EnhancedInput.EnhancedPlayerInput]

; ----------------------------------------------------------------------------
;  AXES - Déplacement & visée (Survivor)
; ----------------------------------------------------------------------------
;  AZERTY : Z=avant, S=arrière, Q=gauche, D=droite
; ----------------------------------------------------------------------------
AxisMappings=(AxisName="MoveForwardSurvivor",Scale=1.000000,Key=Z)
AxisMappings=(AxisName="MoveForwardSurvivor",Scale=-1.000000,Key=S)
AxisMappings=(AxisName="MoveRightSurvivor",Scale=-1.000000,Key=Q)
AxisMappings=(AxisName="MoveRightSurvivor",Scale=1.000000,Key=D)
AxisMappings=(AxisName="MoveForwardSurvivor",Scale=1.000000,Key=Gamepad_LeftY)
AxisMappings=(AxisName="MoveRightSurvivor",Scale=1.000000,Key=Gamepad_LeftX)

; Visée souris (sensibilité gérée dans GameUserSettings.ini)
AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)

; Visée manette / flèches directionnelles (Survivor)
AxisMappings=(AxisName="TurnConstantSurvivor",Scale=1.000000,Key=Gamepad_RightX)
AxisMappings=(AxisName="TurnConstantSurvivor",Scale=-1.000000,Key=Left)
AxisMappings=(AxisName="TurnConstantSurvivor",Scale=1.000000,Key=Right)
AxisMappings=(AxisName="LookUpConstantSurvivor",Scale=1.000000,Key=Gamepad_RightY)
AxisMappings=(AxisName="LookUpConstantSurvivor",Scale=1.000000,Key=Up)
AxisMappings=(AxisName="LookUpConstantSurvivor",Scale=-1.000000,Key=Down)

; Drone / spectateur - vertical (Q=monter, Z=descendre est inversé par UE)
AxisMappings=(AxisName="MoveUp",Scale=1.000000,Key=Q)
AxisMappings=(AxisName="MoveUp",Scale=-1.000000,Key=Z)


; ----------------------------------------------------------------------------
;  AXES - Déplacement & visée (Killer)
; ----------------------------------------------------------------------------
AxisMappings=(AxisName="MoveForwardKiller",Scale=1.000000,Key=Z)
AxisMappings=(AxisName="MoveForwardKiller",Scale=-1.000000,Key=S)
AxisMappings=(AxisName="MoveRightKiller",Scale=-1.000000,Key=Q)
AxisMappings=(AxisName="MoveRightKiller",Scale=1.000000,Key=D)
AxisMappings=(AxisName="MoveForwardKiller",Scale=1.000000,Key=Gamepad_LeftY)
AxisMappings=(AxisName="MoveRightKiller",Scale=1.000000,Key=Gamepad_LeftX)

; Visée manette / flèches (Killer)
AxisMappings=(AxisName="TurnConstantKiller",Scale=1.000000,Key=Gamepad_RightX)
AxisMappings=(AxisName="TurnConstantKiller",Scale=-1.000000,Key=Left)
AxisMappings=(AxisName="TurnConstantKiller",Scale=1.000000,Key=Right)
AxisMappings=(AxisName="LookUpConstantKiller",Scale=1.000000,Key=Gamepad_RightY)
AxisMappings=(AxisName="LookUpConstantKiller",Scale=1.000000,Key=Up)
AxisMappings=(AxisName="LookUpConstantKiller",Scale=-1.000000,Key=Down)


