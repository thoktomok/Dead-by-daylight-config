; ===============================
; Engine.ini — Profil A (Très Basse Config)
; Machine: <CPU_threads_détectés>/<GPU_détecté>/<VRAM_détectée>
; API: <DX11|DX12>
; Version pack: 1.0.0
; Date: 2025-08-17
; ===============================
; CIBLES: Lisibilité maximale, latence minimale, frametimes stables.
; Pas de motion blur, pas de DOF, post-process minimal, SSR/AO à zéro.
; 100% FAIR-PLAY.
; ===============================

[SystemSettings]
; --- 1) Latence et ordonnancement des threads ---
r.OneFrameThreadLag=0                 ; latence d’entrée réduite, force le CPU à ne pas prendre d'avance sur le GPU.
r.GTSyncType=1                        ; synchronisation légère entre le GameThread et le RenderThread si disponible.
;r.FinishCurrentFrame=0               ; EXPERIMENTAL: Peut réduire la latence mais augmenter la charge CPU. A tester. Sera décommenté par le script si validé.

; --- 2) Post-process minimisé pour la clarté ---
r.MotionBlurQuality=0                 ; pas de flou de mouvement
r.DepthOfFieldQuality=0               ; pas de profondeur de champ pour une netteté constante
r.BloomQuality=0                      ; pas d'effet de lueur excessive
r.LensFlareQuality=0                  ; pas de halos lumineux
r.SceneColorFringeQuality=0           ; pas d’aberration chromatique sur les bords
r.EyeAdaptationQuality=0              ; pas d'ajustement automatique de l'exposition (éblouissement/assombrissement)
r.FilmGrain=0                         ; pas de grain de film

; --- 3) Réflexions et effets coûteux ---
r.SSR.Quality=0                       ; pas de reflets en espace écran (Screen Space Reflections)
r.SSR.Temporal=0                      ; pas d'anti-aliasing pour les SSR
r.RefractionQuality=0                 ; qualité des réfractions (verre, eau) au minimum
r.AmbientOcclusionLevels=0            ; pas d'occlusion ambiante (ombres de contact)
r.AmbientOcclusionQuality=0           ; qualité de l'occlusion ambiante
r.LightShaftQuality=0                 ; pas de "rayons divins"

; --- 4) Anti-aliasing minimal ---
r.PostProcessAAQuality=0              ; AA de type FXAA, le moins cher en performance. Le niveau est géré par GameUserSettings.

; --- 5) Textures et streaming pilotés par VRAM ---
r.TextureStreaming=1                  ; active le streaming des textures pour éviter les pics de charge mémoire
r.Streaming.UseFixedPoolSize=1        ; alloue une taille de pool VRAM fixe pour les textures
r.Streaming.LimitPoolSizeToVRAM=1     ; empêche le pool de dépasser la VRAM disponible (sécurité)
r.Streaming.DefragDynamicBounds=1     ; aide à l'organisation de la mémoire de streaming
r.Streaming.PoolSize=512              ; PROFIL A: 512 Mio pour GPU avec 2-4 Go VRAM
;r.Streaming.MaxTempMemoryAllowed=50  ; EXPERIMENTAL: Limite la mémoire temporaire pour le streaming.
;r.Streaming.AmortizeCPUToGPUCopy=1   ; EXPERIMENTAL: Optimisation pour le transfert CPU -> GPU.
;r.Streaming.MipBias=0                ; EXPERIMENTAL: Biais sur les mipmaps de streaming.

; --- 6) Filtrage et netteté des textures ---
r.MaxAnisotropy=8                     ; Filtrage anisotropique x8, excellent compromis lisibilité/performance.
r.MipMapLODBias=0                     ; Pas de biais sur les mipmaps, évite les textures trop floues ou trop "pixellisées".

; --- 7) Ombres autorisées mais minimales ---
r.ShadowQuality=0                     ; Niveau de qualité le plus bas pour les ombres, mais elles restent présentes.
r.Shadow.CSM.MaxCascades=1            ; Réduit le nombre de cascades d'ombres (détail des ombres à distance).
r.Shadow.MaxResolution=512            ; Résolution maximale des textures d'ombres.

; --- 8) Occlusion Z hiérarchique ---
;r.HZBOcclusion=0                     ; EXPERIMENTAL: Peut améliorer les perfs sur des GPU plus anciens en changeant la méthode d'occlusion.

; --- 9) Garde-fous ---
; Toute ligne refusée par le build shipping du jeu sera commentée automatiquement
; par le script d'installation après analyse du log.
; Voir docs/REJECTED_CVARS.txt et le README pour les explications.

; --- Section réseau préservée ---
; Cette section est spécifique à l'utilisateur et sera fusionnée par le script.
[GameNetDriver StatelessConnectHandlerComponent]
CachedClientID=0
