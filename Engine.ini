; ============================================================================
;  Engine.ini  -  Dead by Daylight (PC, Unreal Engine 4)
; ----------------------------------------------------------------------------
;  Profil : COMPÉTITIF / RÉACTIVITÉ MAXIMALE
;  Cible  : 1080p, 120+ FPS stables, latence d'entrée minimale, visibilité
;           prioritaire sur l'effet "cinématique".
; ----------------------------------------------------------------------------
;  IMPORTANT
;    - Tous les tweaks ci-dessous sont des paramètres standards Unreal Engine
;      largement utilisés par la communauté DBD. Aucun ne contourne EAC.
;    - Les CVars marquées "côté serveur" ou non whitelistées par DBD sont
;      simplement ignorées par le client — elles ne provoquent pas de ban.
;    - Sauvegardez ce fichier en LECTURE SEULE après modification, sinon
;      le jeu écrasera vos réglages au prochain lancement.
;
;  Emplacement Windows :
;    %LOCALAPPDATA%\DeadByDaylight\Saved\Config\WindowsNoEditor\Engine.ini
; ============================================================================


; ----------------------------------------------------------------------------
;  RÉSEAU - Handler client persistant (NE PAS TOUCHER)
; ----------------------------------------------------------------------------
;  CachedClientID est généré par DBD lui-même lors de la première connexion.
;  Le supprimer force le jeu à le régénérer (anodin mais inutile).
; ----------------------------------------------------------------------------
[GameNetDriver StatelessConnectHandlerComponent]
CachedClientID=358


; ----------------------------------------------------------------------------
;  LOGGING - Réduction du bruit dans la console / fichiers logs
; ----------------------------------------------------------------------------
;  Diminue les écritures disque pendant les parties (gain micro mais réel
;  sur HDD ; négligeable sur NVMe).
; ----------------------------------------------------------------------------
[Core.Log]
LogShaderCompilers=NoLogging
LogStreaming=NoLogging
LogNetDormancy=NoLogging
LogNetTraffic=NoLogging
LogStats=NoLogging
LogAudio=Warning
LogAudioMixer=Warning
LogD3D11RHI=Warning


; ----------------------------------------------------------------------------
;  MOTEUR - Cadence et lissage des images
; ----------------------------------------------------------------------------
;  bSmoothFrameRate=False :
;      Désactive le lissage interne d'UE4. On laisse le cap FPS du jeu
;      (FrameRateLimit dans GameUserSettings.ini) gérer la limite.
;      Résultat : input lag réduit et frame time plus régulier.
;
;  NetClientTicksPerSecond :
;      Fréquence à laquelle le CLIENT envoie ses inputs au serveur. La valeur
;      utile maximale côté DBD est ~120 ; au-delà, c'est ignoré.
; ----------------------------------------------------------------------------
[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False
MinDesiredFrameRate=60.000000
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=60.000000),UpperBound=(Type=Exclusive,Value=240.000000))
NetClientTicksPerSecond=120
bForceDisableFrameRateSmoothing=True


; ----------------------------------------------------------------------------
;  GARBAGE COLLECTOR - Évite les micro-freezes en partie
; ----------------------------------------------------------------------------
;  On allonge l'intervalle de purge pour qu'aucun GC majeur ne tombe
;  PENDANT une chase. Les valeurs ci-dessous sont éprouvées sur 16 Go RAM.
;  Si vous avez 8 Go, baissez TimeBetweenPurgingPendingKillObjects à 60.
; ----------------------------------------------------------------------------
[/Script/Engine.GarbageCollectionSettings]
gc.TimeBetweenPurgingPendingKillObjects=180
gc.NumRetriesBeforeForcingGC=10
gc.MinDesiredObjectsPerSubTask=20
gc.MaxObjectsInGame=131072
gc.CreateGCClusters=1
gc.MergeGCClusters=1


; ----------------------------------------------------------------------------
;  STREAMING TEXTURES - Pool dédié, fin du "texture pop-in"
; ----------------------------------------------------------------------------
;  PoolSize en Mo. Adaptez à votre VRAM :
;      - 4 Go VRAM  ->  PoolSize=1500
;      - 6 Go VRAM  ->  PoolSize=2500
;      - 8 Go VRAM  ->  PoolSize=4096   (valeur par défaut ici)
;      - 12 Go+     ->  PoolSize=6144
; ----------------------------------------------------------------------------
[TextureStreaming]
PoolSize=4096
HiddenPrimitiveScale=0.500000
MinMipForSplitRequest=11
PoolSizeVRAMPercentage=70


; ----------------------------------------------------------------------------
;  RENDERER - Effets visuels coûteux désactivés
; ----------------------------------------------------------------------------
;  Le but de DBD compétitif : voir l'adversaire, pas un coucher de soleil.
;  Bloom, motion blur, aberration chromatique = visibilité réduite, FPS plus
;  bas, et nausée pour certains joueurs. Tout est coupé ici.
; ----------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AntiAliasing=2
r.MotionBlurQuality=0
r.SceneColorFringeQuality=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.BloomQuality=0
r.FilmGrain=0
r.TemporalAACurrentFrameWeight=0.3
r.TemporalAASamples=4
r.TemporalAASharpness=1.0
r.PostProcessAAQuality=4


; ----------------------------------------------------------------------------
;  SYSTEM SETTINGS - Cœur de l'optimisation (CVars runtime)
; ----------------------------------------------------------------------------
;  Section [SystemSettings] = override prioritaire des CVars du moteur.
;  Toutes les variables ici sont appliquées au démarrage du jeu.
; ----------------------------------------------------------------------------
[SystemSettings]

; --- Pipeline de rendu ---
r.OneFrameThreadLag=1                 ; 1 = un frame de lag CPU/GPU (norme).
r.FinishCurrentFrame=0                ; 0 = ne pas bloquer le CPU sur le GPU.
r.RHICmdBypass=0                      ; 0 = profite du multi-threading RHI.
r.GTSyncType=1                        ; Sync GameThread / RenderThread sur GPU.
r.D3D12.GPUTimeout=0                  ; Évite le TDR sur compile shaders.

; --- Streaming / Mémoire ---
r.Streaming.PoolSize=4096
r.Streaming.MaxTempMemoryAllowed=512
r.Streaming.HLODStrategy=2
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.AmortizeCPUToGPUCopy=1
r.Streaming.NumStaticComponentsProcessedPerFrame=50

; --- Textures ---
r.MaxAnisotropy=16
r.AnisotropicQuality=4
r.MipMapLODBias=-0.500000             ; Textures légèrement plus nettes.
r.SkeletalMeshLODBias=0
r.StaticMeshLODDistanceScale=1.000000
r.LandscapeLODBias=0

; --- Ombres : équilibre lisibilité / perf ---
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.800000
r.Shadow.RadiusThreshold=0.060000
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.FadeResolution=64
r.Shadow.MinResolution=32
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0

; --- Post-Process désactivé (lisibilité) ---
r.LightShaftQuality=0
r.LightShaftDownSampleFactor=2
r.LensFlareQuality=0
r.SSR.Quality=0
r.SSR.MaxRoughness=0.1
r.SSS.Quality=0
r.SSS.Scale=0
r.SSAO.Quality=0
r.AmbientOcclusionLevels=0
r.AmbientOcclusionRadiusScale=0
r.AmbientOcclusionMaxQuality=0
r.HZBOcclusion=0
r.AllowOcclusionQueries=1
r.OcclusionMaxFrameQueries=8
r.MotionBlur.Max=0
r.MotionBlurSeparable=0
r.SceneColorFringe.Max=0
r.UpscaleQuality=3
r.Tonemapper.Quality=1
r.Tonemapper.GrainQuantization=0
r.Tonemapper.Sharpen=1.000000
r.Tonemapper.MergeBloomWithTonemapper=1
r.FastBlurThreshold=0

; --- Brouillard volumétrique : OFF (souvent abusé pour cacher le killer) ---
r.Fog=1
r.VolumetricFog=0
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricCloud=0

; --- Sky / Atmosphère ---
r.SkyAtmosphere=1
r.SkyLightingQuality=1
r.IndirectLightingCache=0
r.LightFunctionQuality=1

; --- Matériaux / Tessellation ---
r.RefractionQuality=0
r.TranslucencyVolumeBlur=0
r.TranslucencyLightingVolumeDim=24
r.MaterialQualityLevel=1
r.DetailMode=2
r.ParticleLightQuality=0

; --- Niagara FX ---
fx.Niagara.QualityLevel=1
fx.MaxCPUParticlesPerEmitter=100
fx.MaxGPUParticlesSpawnedPerFrame=2000
fx.Niagara.ForceLastTickGroup=1

; --- Vue / Distance ---
r.ViewDistanceScale=1.000000
r.SkeletalMeshLODBias=0
r.StaticMeshLODDistanceScale=1.000000

; --- Compilation shaders : précompile au démarrage ---
r.ShaderPipelineCache.StartupMode=2
r.ShaderPipelineCache.BatchSize=50
r.ShaderPipelineCache.BackgroundBatchSize=10
r.ShaderPipelineCache.LazyLoadShadersWhenPSOCacheIsPresent=1
r.CreateShadersOnLoad=1

; --- Réseau / Physique ---
net.MaxRepArraySize=4096
net.MaxRepArrayMemory=65535
p.NetEnableMoveCombining=1
p.NetUseClientTimestampForReplicatedTransform=1
p.EnableMultithreadedPhysics=1
p.NetForceClientAdjustmentPercent=0.1

; --- Audio : low-latency ---
au.DisableParallelSourceProcessing=0
au.MaxConcurrentStreams=24
au.SoundDistanceOptimizationLength=1.0

; --- GC en cas de RAM basse (filet de sécurité) ---
gc.LowMemory.IncrementalGCTimePerFrame=0.002
gc.LowMemory.MemoryThresholdMB=400
gc.LowMemory.TimeBetweenPurgingPendingKillObjects=30
gc.LowMemory.TimeBetweenPurgingPendingKillObjectsOnIdleServer=10

; --- Anti micro-freeze ---
s.LevelStreamingActorsUpdateTimeLimit=5.0
s.UnregisterComponentsTimeLimit=2.0
s.IoDispatcherCacheSizeMB=512

; --- Désactivation du warning visibilité précomputée ---
r.PrecomputedVisibilityWarning=0
r.SupportAllShaderPermutations=False
r.GPUStatsEnabled=0


; ----------------------------------------------------------------------------
;  AUDIO - Latence minimale, mixer multi-thread
; ----------------------------------------------------------------------------
[Audio]
UnfocusedVolumeMultiplier=0.000000


[/Script/Engine.AudioSettings]
bAllowPlayWhenSilent=False
bDisableMasterEQ=True


; ----------------------------------------------------------------------------
;  STARTUP MOVIES - Skipper les logos
; ----------------------------------------------------------------------------
;  Désactive les vidéos d'intro (logos Behaviour, EAC, etc.).
;  Gain : 5-10 secondes au lancement.
; ----------------------------------------------------------------------------
[/Script/MoviePlayer.MoviePlayerSettings]
bWaitForMoviesToComplete=False
bMoviesAreSkippable=True


; ----------------------------------------------------------------------------
;  FIN DE FICHIER
; ----------------------------------------------------------------------------
