; ====================================================================================
; Dead by Daylight - Profil de Stabilité (par Jules pour DBD-SelfHeal-Pack)
; RÔLE : Fichier de base "idéal" pour la normalisation.
; Contient les paramètres utilisateur essentiels pour la stabilité.
; ====================================================================================

[/Script/Engine.GameUserSettings]
; --- Paramètres d'affichage principaux ---
bUseVSync=False                       ; Indispensable : Désactive la V-Sync du jeu pour minimiser la latence.
FullscreenMode=1                      ; Recommandé : Force le mode Fenêtré Plein Écran pour la stabilité (0=Plein Écran, 1=Fenêtré PE).
PreferredFullscreenMode=1             ; Confirme la préférence pour le Fenêtré Plein Écran.
FrameRateLimit=0.000000               ; Essentiel : Supprime la limite d'images par seconde du jeu pour éviter un double capping. Un limiteur externe est conseillé.
bUseDynamicResolution=False           ; Désactive la résolution dynamique qui peut flouter l'image.

; --- Résolution (Placeholder) ---
; Le script de normalisation remplacera ces valeurs par la résolution native de l'utilisateur.
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080

[ScalabilityGroups]
; --- Groupes de qualité graphique ---
; Réglages bas/moyens pour assurer une base de performance stable.
; Ne supprime aucun élément essentiel au gameplay.
sg.ResolutionQuality=100.000000
sg.ViewDistanceQuality=2              ; Distance d'affichage (2 = Haute, bon compromis).
sg.AntiAliasingQuality=1              ; Anti-aliasing minimal (1 = Bas) pour éviter le scintillement sans trop flouter.
sg.ShadowQuality=0                    ; Ombres au minimum (correspond à Engine.ini).
sg.GlobalIlluminationQuality=0        ; Illumination globale désactivée (très coûteux).
sg.ReflectionQuality=0                ; Reflets désactivés (très coûteux).
sg.PostProcessQuality=0               ; Post-traitement au minimum (correspond à Engine.ini).
sg.TextureQuality=2                   ; Textures en "Haute" (2). Sera ajusté si la VRAM est faible.
sg.EffectsQuality=1                   ; Effets en "Bas" (1).
sg.FoliageQuality=1                   ; Végétation en "Bas" (1).
sg.ShadingQuality=1                   ; Qualité du shading en "Bas" (1).
sg.AnimationQuality=1                 ; Qualité des animations en "Bas" (1).

[/Script/DeadByDaylight.DBDGameUserSettings]
; --- Paramètres spécifiques à Dead by Daylight ---
; Seules les options non personnelles et liées à la stabilité sont définies ici.
; Les autres (FOV, Sensibilité, etc.) seront préservées depuis le fichier de l'utilisateur.
Crossplay=True
MuteOnFocusLoss=True
TerrorRadiusVisualFeedback=True       ; Aide à l'accessibilité importante à conserver.
