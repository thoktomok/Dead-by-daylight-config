; ====================================================================================
; Input.ini — Profil Universel
; OBJECTIF : Assurer un input souris "brut" (Raw Input).
; ====================================================================================

[/Script/Engine.InputSettings]
; --- Paramètres de la Souris ---
; Ces réglages garantissent que les mouvements de la souris sont traduits 1:1 dans le jeu,
; sans aucune modification logicielle qui pourrait nuire à la précision et à la mémoire musculaire.
bEnableMouseSmoothing=False           ; Désactive le lissage de la souris (crée une sensation de "flottement").
bViewAccelerationEnabled=False        ; Désactive l'accélération de la souris (modifie la sensibilité selon la vitesse).

; NOTE: Ce fichier ne contient volontairement AUCUNE attribution de touche (ActionMappings).
; Le script d'installation est conçu pour préserver les attributions existantes de l'utilisateur
; tout en s'assurant que les paramètres ci-dessus sont bien appliqués.
