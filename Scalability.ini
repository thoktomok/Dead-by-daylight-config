; ----------------------------------------------------------------------------
;  FEUILLAGE (sg.FoliageQuality)
; ----------------------------------------------------------------------------
;  IMPORTANT : ne PAS descendre trop bas. Le feuillage trop épuré
;  donne un avantage déloyal (anti-bush). On garde du détail.
; ----------------------------------------------------------------------------
[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[FoliageQuality@1]
