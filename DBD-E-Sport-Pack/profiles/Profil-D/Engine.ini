; ===============================
; Engine.ini — Profil D (Très Haute Config)
; Machine: <CPU_threads_détectés>/<GPU_détecté>/<VRAM_détectée>
; API: <DX11|DX12>
; Version pack: 1.0.0
; Date: 2025-08-17
; ===============================
; CIBLES: Qualité de texture maximale (Ultra), latence minimale et frametimes ultra stables pour écrans à haut rafraîchissement.
; 100% FAIR-PLAY.
; ===============================

[SystemSettings]
; --- 1) Latence et ordonnancement des threads ---
r.OneFrameThreadLag=0
r.GTSyncType=1
;r.FinishCurrentFrame=0

; --- 2) Post-process minimisé pour la clarté ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.EyeAdaptationQuality=0
r.FilmGrain=0

; --- 3) Réflexions et effets coûteux ---
r.SSR.Quality=0
r.SSR.Temporal=0
r.RefractionQuality=0
r.AmbientOcclusionLevels=0
r.AmbientOcclusionQuality=0
r.LightShaftQuality=0

; --- 4) Anti-aliasing minimal ---
r.PostProcessAAQuality=0

; --- 5) Textures et streaming pilotés par VRAM ---
r.TextureStreaming=1
r.Streaming.UseFixedPoolSize=1
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.DefragDynamicBounds=1
r.Streaming.PoolSize=2048             ; PROFIL D: 2048 Mio pour GPU avec 12+ Go VRAM
;r.Streaming.MaxTempMemoryAllowed=50
;r.Streaming.AmortizeCPUToGPUCopy=1
;r.Streaming.MipBias=0

; --- 6) Filtrage et netteté des textures ---
r.MaxAnisotropy=8
r.MipMapLODBias=0

; --- 7) Ombres autorisées mais minimales ---
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512

; --- 8) Occlusion Z hiérarchique ---
;r.HZBOcclusion=0

; --- 9) Garde-fous ---
; Toute ligne refusée par le build shipping du jeu sera commentée automatiquement
; par le script d'installation après analyse du log.

; --- Section réseau préservée ---
[GameNetDriver StatelessConnectHandlerComponent]
CachedClientID=0
