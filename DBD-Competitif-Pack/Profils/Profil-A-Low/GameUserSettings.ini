; ====================================================================================
; Dead by Daylight - Profil Compétitif (par Jules)
; PROFIL A : Très Basse Config
; OBJECTIF : Stabilité, FPS élevés, options graphiques de base.
; ====================================================================================

[/Script/Engine.GameUserSettings]
; --- Options d'Affichage et de Synchronisation ---
bUseVSync=False                       ; Désactive la synchronisation verticale DANS LE JEU. Essentiel pour réduire la latence.
FullscreenMode=1                      ; Force le mode Fenêtré Plein Écran. Plus stable pour alt-tab et gère mieux les FPS. (0=Plein écran, 1=Fenêtré PE, 2=Fenêtré)
PreferredFullscreenMode=1             ; Confirme la préférence pour le mode Fenêtré Plein Écran.
bUseDynamicResolution=False           ; Désactive la résolution dynamique, qui peut rendre l'image floue.
FrameRateLimit=0.000000               ; DÉBLOQUE la limite d'images par seconde DANS LE JEU. Il est conseillé d'utiliser un limiteur externe (RivaTuner, panneau Nvidia/AMD) pour un frametime stable.

; --- Résolution (Gérée par le script) ---
; Le script d'installation détectera et inscrira automatiquement votre résolution native ici.
; Si vous modifiez manuellement, changez les 4 lignes suivantes.
ResolutionSizeX=1920
ResolutionSizeY=1080
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080

; --- Options Diverses ---
bUseDesiredScreenHeight=False         ; Option legacy, à laisser sur False.
bUseHDRDisplayOutput=False            ; Désactive le HDR. Inutile pour le jeu compétitif et coûteux en performance.
AudioQualityLevel=1                   ; Qualité audio (0=Basse, 1=Haute). 1 est recommandé pour ne pas perdre d'indices sonores.

[ScalabilityGroups]
; Ces groupes contrôlent la qualité des différents aspects graphiques du jeu.
; Le jeu propose des presets (Bas, Moyen, Haut, Ultra), mais nous les forçons ici pour un contrôle total.
; Pour un profil performance, la plupart des valeurs sont à 0 (le plus bas).
sg.ResolutionQuality=100.000000
sg.ViewDistanceQuality=1              ; Qualité de la distance d'affichage. 1 est un bon compromis pour voir l'essentiel sans impacter les perfs.
sg.AntiAliasingQuality=0              ; Qualité de l'Anti-Aliasing. 0 = désactivé ou au plus bas, pour une image nette.
sg.ShadowQuality=0                    ; Qualité des ombres. Doit correspondre à Engine.ini.
sg.GlobalIlluminationQuality=0        ; Qualité de l'illumination globale (coûteux).
sg.ReflectionQuality=0                ; Qualité des reflets (coûteux).
sg.PostProcessQuality=0               ; Qualité du post-traitement (bloom, motion blur, etc.). Doit correspondre à Engine.ini.
sg.TextureQuality=0                   ; QUALITÉ DES TEXTURES POUR PROFIL A. 0 = Basse.
sg.EffectsQuality=0                   ; Qualité des effets visuels (explosions, particules).
sg.FoliageQuality=0                   ; Qualité de la végétation.
sg.ShadingQuality=0                   ; Qualité du shading (calcul de la lumière sur les surfaces).
sg.AnimationQuality=0                 ; Qualité des animations (impact mineur sur le GPU, mais 0 pour la cohérence).
