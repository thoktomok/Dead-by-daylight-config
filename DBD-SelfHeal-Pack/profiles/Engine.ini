; ====================================================================================
; Dead by Daylight - Profil de Stabilité (par Jules pour DBD-SelfHeal-Pack)
; RÔLE : Fichier de base "idéal" pour la normalisation.
; Il contient des paramètres système optimisés pour la performance et la stabilité.
; ====================================================================================

; --- Section réseau préservée depuis le fichier source ---
; Cette section est spécifique à l'utilisateur et sera fusionnée.
[GameNetDriver StatelessConnectHandlerComponent]
CachedClientID=0


; --- Section des paramètres système (graphismes et performance) ---
[SystemSettings]
; L'objectif est de réduire la latence, désactiver les effets visuels lourds et inutiles,
; et configurer un streaming de textures stable.

; Latence et Threading
r.OneFrameThreadLag=0                 ; Réduit le décalage d'une image entre le CPU et le GPU.

; Qualité d'image "Clean" (sans effets superflus)
r.SceneColorFringeQuality=0           ; Supprime l'aberration chromatique.
r.Tonemapper.GrainQuantization=0      ; Supprime le grain de film.
r.MotionBlur.Max=0                    ; Désactive le flou de mouvement.
r.MotionBlurQuality=0                 ; Qualité du flou de mouvement (sécurité).
r.LensFlareQuality=0                  ; Désactive les effets de "lens flare".
r.BloomQuality=0                      ; Désactive l'effet de "bloom" (lueur).
r.DepthOfFieldQuality=0               ; Désactive le flou de profondeur de champ.

; Post-Process et Ombres (optimisés pour la performance)
r.SSR.Quality=0                       ; Désactive les reflets en espace écran (Screen Space Reflections).
r.AmbientOcclusionLevels=0            ; Désactive l'occlusion ambiante.
r.ShadowQuality=0                     ; Qualité des ombres au minimum.
r.Shadow.CSM.MaxCascades=1            ; Moins de détails pour les ombres à distance.
r.Shadow.MaxResolution=512            ; Résolution maximale des ombres.

; Anti-Aliasing
; La qualité de l'AA est gérée dans GameUserSettings.ini, mais on s'assure que le moteur
; n'impose pas de réglage par défaut trop élevé.
r.DefaultFeature.AntiAliasing=0

; Filtrage des Textures
r.MaxAnisotropy=8                     ; Bon compromis qualité/performance pour la netteté des textures vues en angle.

; Streaming des Textures
r.TextureStreaming=1                  ; Active le streaming.
r.Streaming.UseFixedPoolSize=1        ; Alloue un pool de mémoire fixe pour les textures.
r.Streaming.LimitPoolSizeToVRAM=1     ; Empêche le pool de dépasser la VRAM (sécurité).
; La ligne suivante est un placeholder. Le script la remplacera par la valeur calculée.
r.Streaming.PoolSize=1024             ; VALEUR PAR DÉFAUT (sera adaptée à la VRAM de l'utilisateur).
