; ============================================================================
;  GameUserSettings.ini  -  Dead by Daylight (PC)
; ----------------------------------------------------------------------------
;  Profil : COMPÉTITIF / LISIBILITÉ MAXIMALE
;  Résolution cible : 1920x1080 plein écran, 120 FPS
;
;  CORRECTIONS APPORTÉES PAR RAPPORT AU FICHIER D'ORIGINE :
;    [!] Doublons supprimés : Gamma (x3), MainVolume (x2),
;        SurvivorCameraSensitivity (x2), KillerCameraSensitivity (x2),
;        SurvivorMouseSensitivity (x2), KillerMouseSensitivity (x2),
;        InvertY (x2), LegacyPrestigePortraits (x2), LargeText (x2),
;        ColorblindMode (x2), MenuMusicVolume (x2),
;        TerrorRadiusVisualFeedback (x2), VoiceOverLanguage (x2),
;        PreferredFullscreenMode (x2), AudioQualityLevel (x2)
;    [!] Sections regroupées et ordonnées logiquement.
;    [!] Commentaires inline pour chaque réglage non trivial.
;
;  Emplacement Windows :
;    %LOCALAPPDATA%\DeadByDaylight\Saved\Config\WindowsNoEditor\
;      GameUserSettings.ini
; ============================================================================


; ----------------------------------------------------------------------------
;  ENGINE GAME USER SETTINGS - Bloc générique Unreal Engine
; ----------------------------------------------------------------------------
[/Script/Engine.GameUserSettings]
bUseVSync=False                                  ; V-Sync OFF : latence minimale
bUseDynamicResolution=False                      ; Résolution dynamique OFF
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
FullscreenMode=0                                 ; 0=Plein écran exclusif, 1=Borderless, 2=Fenêtré
PreferredFullscreenMode=0
AudioQualityLevel=0                              ; 0=Low (moins d'overhead CPU audio)
FrameRateLimit=0.000000                          ; Override par DBD plus bas
Language=fr
bUseDesiredScreenHeight=False


; ----------------------------------------------------------------------------
;  SCALABILITY GROUPS - Buckets globaux de qualité graphique
; ----------------------------------------------------------------------------
;  Échelle Unreal Engine : 0=Low, 1=Medium, 2=High, 3=Epic, 4=Cinematic
;  On vise : Medium (2) sauf pour les éléments critiques visibilité.
; ----------------------------------------------------------------------------
[ScalabilityGroups]
sg.ResolutionQuality=100                         ; 100% = résolution native
sg.ViewDistanceQuality=2                         ; Voir au loin = info compétitive
sg.AntiAliasingQuality=2                         ; TAA medium suffit
sg.ShadowQuality=2                               ; Indispensable pour voir killer/survivor
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=2                              ; Pas trop bas (camouflage anti-bush)
sg.ShadingQuality=2
sg.AnimationQuality=2
sg.TextureStreaming=0                            ; 0 = streaming agressif (moins de RAM)
sg.LandscapeQuality=3


; ----------------------------------------------------------------------------
;  DEAD BY DAYLIGHT GAME USER SETTINGS - Spécifique BHVR
; ----------------------------------------------------------------------------
[/Script/DeadByDaylight.DBDGameUserSettings]

; --- Qualité globale ---
ScalabilityLevel=2
AutoScalabilitySet=False                         ; OFF pour garder NOS réglages
AutoAdjust=False

; --- Frame Rate ---
FrameRateLimit=120.000000                        ; 120 FPS cap (déconseillé 0 = uncapped sur DBD)
FPSLimitMode=120

; --- Champ de vision ---
FieldOfView=103                                  ; Max = 103 côté survivor (debate FOV killer non modifiable)

; --- Aim Assist (utile en cas de souris ou contrôleur) ---
AimAssist=True
AimAssistStrength=1.0
AimAssistRange=2000.0

; --- Anti-aliasing : 0=Off, 1=FXAA, 2=TAA ---
AntiAliasingMode=0                               ; OFF : image la plus nette possible

; --- Upscalers ---
EnableFSR=False                                  ; AMD FSR off à 1080p (utile au-dessus)
XeSSMode=0                                       ; Intel XeSS off

; --- Voice Chat ---
VoiceChatEnabled=True
VoiceChatInputDevice=
VoiceChatOutputDevice=
MuteOnFocusLoss=True

; --- Vibrations ---
HapticsVibration=False
HapticsVibrationPS5=True

; --- Musique : OFF en partie pour mieux entendre les sons-info ---
MainMenuMusic=False
LobbyMusic=False

; --- Social / HUD ---
ShowPlayerNames=True
PartyPrivacy=FriendsOnly
PartyPrivacyState=friends
SkillCheck=False                                 ; (option de bind alternatif, sans impact)

; --- Sensibilités caméra / souris ---
;  Plage normalisée 0-100. Doublons d'origine consolidés.
SurvivorCameraSensitivity=50
KillerCameraSensitivity=50
SurvivorMouseSensitivity=50
KillerMouseSensitivity=50
SurvivorControllerSensitivity=50
KillerControllerSensitivity=50

; --- Inversion axe Y ---
InvertY=False
SurvivorInvertY=False
SurvivorInvertYAxisController=False
SurvivorInvertYAxisMouse=False
KillerInvertYAxisController=False
KillerInvertYAxisMouse=False

; --- Portraits prestige (legacy en hommage aux anciens P3) ---
LegacyPrestigePortraits=True

; --- Identité / Cross-platform ---
PlayerId=
Crossplay=True
AutoDeclineFriendRequests=False
DeviceLoginTokenID=
SharedLoginInformation=(LoginProvider="",AuthToken="",TokenType="")
IsAnonymousMode=False
HideYourName=False
HideOtherNames=False

; --- Accessibilité ---
LargeText=False
ColorblindMode=0                                 ; 0=Off, 1=Protanopie, 2=Deutéranopie, 3=Tritanopie
ColorblindIntensity=100
ColorBlindModeIntensity=0
Subtitles=True
SubtitlesBackgroundOpacity=1
SubtitlesSize=1

; --- Volume audio (0-100) ---
MainVolume=80                                    ; 80 = headroom pour pas saturer dans une chase
MainVolumeOn=True
MenuMusicVolume=100
MenuMusicVolumeOn=True
Headphones=True
UseHeadphones=True                               ; HRTF activé : LOCALISATION 3D du son
MuteOnFocus=True
MuteOnFocusLost=True

; --- HUD : visibilité maximale ---
PlayerCardAnimation=False                        ; OFF = lobby plus rapide
PlayerCardBadge=False
PlayerCardBanner=False
PlayerCardAnimationMode=0
ShowPortraitBorder=False
ShowHudStatusEffectValueNumber=True              ; Affiche les chrono debuffs
AnimateRarityBackgrounds=False
TerrorRadiusVisualFeedback=True                  ; CRUCIAL côté sourd / pour Stridor
DeepWoundBarVisibility=True
HUDPlayerNamesVisibility=True
HUDKillerHookCountVisibility=True
HUDScoreEventsVisibility=True
HUDConstrainedAspectRatio=True
HUDUseItemPickupPopupAbridgedVersion=False

; --- Échelle HUD ---
MenuScaleFactor=100
HudScaleFactor=100
SkillCheckScaleFactor=100

; --- Localisation vocale ---
VoiceOverLanguage=2                              ; 2 = anglais (sous-titres FR conservés)

; --- GAMMA - LE RÉGLAGE LE PLUS IMPORTANT ---
;  Valeurs de référence :
;    2.2  ->  cinématique / fidèle
;    2.8  ->  équilibré, recommandé compétitif
;    3.2+ ->  cartes très sombres, MAIS image délavée
Gamma=2.800000
SharpnessValue=0.500000                          ; Léger sharpen sans halos

; --- Résolution / rendu ---
bUseDynamicResolution=False
ScreenRenderSize=100
ResolutionSizeX=1920
ResolutionSizeY=1080
PreferredFullscreenMode=1                        ; 1 = borderless (alt-tab rapide)
FullscreenMode=1
LastConfirmedFullscreenMode=1
LastUserConfirmedResolutionSizeX=1920
LastUserConfirmedResolutionSizeY=1080
WindowPosX=0
WindowPosY=0
DesiredScreenWidth=1920
DesiredScreenHeight=1080
LastUserConfirmedDesiredScreenWidth=1920
LastUserConfirmedDesiredScreenHeight=1080
LastRecommendedScreenWidth=-1.000000
LastRecommendedScreenHeight=-1.000000

; --- HDR (seulement si écran HDR400 ou plus) ---
bUseHDRDisplayOutput=False
HDRDisplayOutputNits=1000

; --- Benchmarks (laisser tel quel) ---
LastCPUBenchmarkResult=-1.000000
LastGPUBenchmarkResult=-1.000000
LastGPUBenchmarkMultiplier=1.000000

; --- Bloodweb ---
BloodwebInteractionBehaviour=True
ShowAllPerks=True

; --- Confort de jeu ---
bUseVSync=False
bForceUnicodeText=True                           ; Forçage Unicode (pseudos asiatiques OK)
bUseOldLobby=True                                ; OFF = nouveau lobby (à goûts)
AudioQualityLevel=0

; --- Contrôles : 0 = défaut, 1 = configuration alternative ---
ControlType=1
SprintToCancel=False
KillerToggleInteractions=False
SurvivorToggleInteractions=False

; --- Langue ---
Language=fr
LanguageIsDefinedByPlayer=False

; --- News / Onboarding ---
HighestWeightSeenNews=0
LastPanelContextId=0
HasAcceptedCrossplayPopup=True
HasAcceptedProgressionSystemInfoPopup=True
HasAcceptedHapticsVibrationPopup=False
BeginnerMode=True

; --- Archives ---
ArchivesAutoPlayVoiceOver=True
ArchivesFullscreenTextVisibility=True

; --- Atlanta (refonte mobile/console quick-turn) ---
UseAtlantaCustomizedHuds=False
UseAtlantaSurvivorQuickTurn=True
UseAtlantaKillerQuickTurn=True

; --- Copyright music ---
AllowCopyrightedMusic=True

; --- Matchmaking ---
HiddenMatchmakingDelay=False

; --- Notifications challenges ---
TomesChallengeNotification=1
DailyChallengeNotification=1
EventChallengeNotification=1
BattlePassChallengeNotification=1
MilestoneChallengeNotification=1
OnboardingChallengeNotification=1

; --- Spectateur ---
SpectatorHudPlayersHotkeys=True
SpectatorHudKillerPreview=True

; --- Version du fichier (géré par DBD) ---
Version=5
LastConfirmedAudioQualityLevel=0


; ----------------------------------------------------------------------------
;  OPTIMIZATION - Section custom interprétée par DBD
; ----------------------------------------------------------------------------
[DeadByDaylight.Optimization]
bDisableLobbyMusic=True                          ; Lobby silencieux = meilleure attention
bLowMemoryMode=False                             ; True si <= 8 Go RAM
bPreloadLobbyAssets=True                         ; Précharge le lobby (RAM > latence)


; ----------------------------------------------------------------------------
;  INPUT - Comportement souris
; ----------------------------------------------------------------------------
[Input]
bEnableRawInput=True                             ; Raw input mouse : précision 1:1
bEnableDoubleClick=False                         ; Évite les doubles activations en chase
bEnableMenuClickSound=False                      ; Menu silencieux


; ----------------------------------------------------------------------------
;  SHADER PIPELINE CACHE
; ----------------------------------------------------------------------------
[ShaderPipelineCache.CacheFile]
LastOpened=DeadByDaylight


; ----------------------------------------------------------------------------
;  INTERNATIONALISATION
; ----------------------------------------------------------------------------
[Internationalization]
bUseLocalizedNumericInput=False                  ; Saisie numérique ASCII (compat FR)
bUseLocalizedDatesAndTimes=False


; ============================================================================
;  FIN DE FICHIER
; ============================================================================
