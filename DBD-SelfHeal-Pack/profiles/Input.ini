; Dead by Daylight - Profil de Stabilité (par Jules pour DBD-SelfHeal-Pack)
; RÔLE : Fichier de base "idéal" pour la normalisation de l'input.
; Contient uniquement les paramètres pour un input souris "brut".
; ====================================================================================

[/Script/Engine.InputSettings]
; --- Paramètres de la Souris ---
; Ces réglages garantissent que les mouvements de la souris sont traduits 1:1 dans le jeu,
; sans aucune modification logicielle qui pourrait nuire à la précision.
bEnableMouseSmoothing=False           ; Désactive le lissage de la souris.
bViewAccelerationEnabled=False        ; Désactive l'accélération de la souris.

; NOTE: Ce fichier ne contient volontairement AUCUNE attribution de touche (ActionMappings).
; Le script de normalisation préservera les attributions existantes de l'utilisateur.
