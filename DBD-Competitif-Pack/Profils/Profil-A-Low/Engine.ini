; ====================================================================================
; Dead by Daylight - Profil Compétitif (par Jules)
; PROFIL A : Très Basse Config (GPU avec 2 à 4 Go de VRAM)
; OBJECTIF : Performance maximale, latence minimale, lisibilité propre.
; 100% FAIR-PLAY : Aucune modification non autorisée.
; ====================================================================================

[SystemSettings]
; --- Latence et Synchronisation Moteur ---
; L'objectif est de réduire au maximum le délai entre vos actions et leur affichage.
r.OneFrameThreadLag=0                 ; Supprime le buffer d'une image entre le CPU et le GPU. Peut réduire la latence mais augmenter la charge CPU.
r.GTSyncType=1                        ; Tente une synchronisation légère entre le GameThread et le RenderThread. À 0, ils sont désynchronisés.

; --- Netteté et Qualité d'Image "Clean" ---
; Supprime tous les effets visuels superflus qui floutent l'image ou ajoutent du "bruit" visuel.
r.SceneColorFringeQuality=0           ; Supprime l'aberration chromatique (liseré de couleur sur les bords).
r.Tonemapper.GrainQuantization=0      ; Supprime le grain de film ajouté par le tonemapper.
r.MotionBlur.Max=0                    ; Désactive complètement le flou de mouvement.
r.MotionBlurQuality=0                 ; Qualité du flou de mouvement (redondant mais sécurisant).
r.LensFlareQuality=0                  ; Désactive les effets de "lens flare" (halos lumineux).
r.BloomQuality=0                      ; Désactive l'effet de "bloom" (lueur autour des sources lumineuses).
r.DepthOfFieldQuality=0               ; Désactive le flou de profondeur de champ (arrière-plan flou).
r.EyeAdaptationQuality=0              ; Désactive l'adaptation de l'oeil (simulation d'éblouissement/assombrissement).
r.FilmGrain=0                         ; Désactive l'effet de grain de film (autre cvar).

; --- Post-Process et Réflexions (Coûteux) ---
; Ces effets sont très gourmands et apportent peu à la lisibilité compétitive.
r.SSR.Quality=0                       ; Désactive les Screen Space Reflections (reflets sur les surfaces).
r.SSR.Temporal=0                      ; Désactive l'anti-aliasing temporel pour les SSR.
r.RefractionQuality=0                 ; Qualité des réfractions (verre, eau).
r.AmbientOcclusionLevels=0            ; Désactive l'occlusion ambiante (ombres de contact douces).
r.AmbientOcclusionQuality=0           ; Qualité de l'occlusion ambiante.
r.LightShaftQuality=0                 ; Désactive les "rayons divins" (rayons de lumière volumétriques).

; --- Ombres ---
; Réglages bas pour les ombres afin de gagner en performance, sans les supprimer complètement (ce qui serait interdit et désavantageux).
r.ShadowQuality=0                     ; Niveau de qualité le plus bas pour les ombres.
r.Shadow.CSM.MaxCascades=1            ; Réduit le nombre de cascades d'ombres (détail des ombres à distance).
r.Shadow.MaxResolution=512            ; Résolution maximale des textures d'ombres.

; --- Anti-Aliasing ---
; Forcé au minimum pour une image brute et nette, ce qui aide à la détection des mouvements.
r.DefaultFeature.AntiAliasing=0       ; Tente de désactiver l'AA au niveau moteur. Sera outrepassé par GameUserSettings.ini si verrouillé.

; --- Filtrage des Textures ---
; Un bon compromis entre textures nettes à angle faible et performance.
r.MaxAnisotropy=8                     ; Filtrage anisotropique. 8 est un excellent rapport qualité/performance.
r.MipMapLODBias=0                     ; Pas de biais sur les mipmaps, évite les textures trop floues ou trop "pixellisées".

; --- Streaming des Textures (Dynamique par Profil) ---
; Crucial pour éviter le "stuttering" (saccades) lié au chargement des textures.
r.TextureStreaming=1                  ; Active le streaming des textures.
r.Streaming.DefragDynamicBounds=1     ; Aide à l'organisation de la mémoire de streaming.
r.Streaming.UseFixedPoolSize=1        ; Utilise une taille de pool VRAM fixe pour les textures.
r.Streaming.LimitPoolSizeToVRAM=1     ; Empêche le pool de dépasser la VRAM disponible (sécurité).
r.Streaming.MipBias=0                 ; Pas de biais sur les mipmaps de streaming.
r.Streaming.PoolSize=512              ; TAILLE DU POOL POUR PROFIL A (512 Mo). Adapté pour les GPU avec 2-4 Go de VRAM.

; --- CVars Avancées (Légitimes mais à surveiller) ---
; Ces commandes peuvent améliorer la performance ou la latence, mais leur support dépend du build du jeu.
; Elles sont incluses ici pour test. Si le jeu les ignore, il n'y a aucun impact négatif.
r.HZBOcclusion=0                      ; Désactive l'occlusion "Hierarchical Z-Buffer". Peut améliorer les perfs sur des GPU plus anciens.
r.FinishCurrentFrame=0                ; Tente d'envoyer l'image sans attendre. Potentiellement moins de latence.
r.SceneColorFormat=3                  ; Utilise un format de couleur moins riche en bits (PF_R8G8B8A8). Peut améliorer les perfs au détriment de la fidélité des couleurs.
r.Streaming.AmortizeCPUToGPUCopy=1    ; Optimisation pour le transfert des textures du CPU vers le GPU.
r.Streaming.MaxTempMemoryAllowed=50   ; Limite la mémoire temporaire allouée au streaming.
