; ============================================================================
;  Scalability.ini  -  Dead by Daylight (PC, Unreal Engine 4)
; ----------------------------------------------------------------------------
;  Ce fichier REDÉFINIT ce que veulent dire les niveaux de qualité
;  (sg.ShadowQuality=2, sg.EffectsQuality=2, etc.) déclarés dans
;  GameUserSettings.ini -> [ScalabilityGroups].
;
;  Sans ce fichier, les buckets utilisent les valeurs par défaut d'Unreal.
;  Ici on les rééquilibre pour DBD : préserver la VISIBILITÉ des survivors
;  et du killer en toutes circonstances, sans gaspiller de GPU sur
;  des effets cinématiques.
;
;  Échelle des groupes : @0=Low, @1=Medium, @2=High, @3=Epic, @4=Cinematic
;  Le niveau actif est celui défini dans GameUserSettings.ini.
;  Profil par défaut ici : niveau @2 (High) optimisé.
;
;  Emplacement Windows :
;    %LOCALAPPDATA%\DeadByDaylight\Saved\Config\WindowsNoEditor\Scalability.ini
; ============================================================================


; ----------------------------------------------------------------------------
;  RÉSOLUTION (sg.ResolutionQuality)
; ----------------------------------------------------------------------------
[ResolutionQuality@0]
r.ScreenPercentage=50

[ResolutionQuality@1]
r.ScreenPercentage=71

[ResolutionQuality@2]
r.ScreenPercentage=87

[ResolutionQuality@3]
r.ScreenPercentage=100

[ResolutionQuality@Cine]
r.ScreenPercentage=100


; ----------------------------------------------------------------------------
;  DISTANCE DE VUE (sg.ViewDistanceQuality)
; ----------------------------------------------------------------------------
;  Pour DBD : on ne descend JAMAIS en dessous de 0.6 — voir au loin = info.
; ----------------------------------------------------------------------------
[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=2
r.ViewDistanceScale=0.6

[ViewDistanceQuality@1]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.8

[ViewDistanceQuality@2]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0

[ViewDistanceQuality@3]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.0

[ViewDistanceQuality@Cine]
r.SkeletalMeshLODBias=0
r.ViewDistanceScale=1.2


; ----------------------------------------------------------------------------
;  ANTI-ALIASING (sg.AntiAliasingQuality)
; ----------------------------------------------------------------------------
[AntiAliasingQuality@0]
r.PostProcessAAQuality=0

[AntiAliasingQuality@1]
r.PostProcessAAQuality=2

[AntiAliasingQuality@2]
r.PostProcessAAQuality=3

[AntiAliasingQuality@3]
r.PostProcessAAQuality=4

[AntiAliasingQuality@Cine]
r.PostProcessAAQuality=6


; ----------------------------------------------------------------------------
;  OMBRES (sg.ShadowQuality)
; ----------------------------------------------------------------------------
;  Crucial : on garde toujours assez de qualité pour distinguer
;  une silhouette de killer dans une ombre portée.
; ----------------------------------------------------------------------------
[ShadowQuality@0]
r.LightFunctionQuality=0
r.ShadowQuality=0
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=512
r.Shadow.RadiusThreshold=0.06
r.Shadow.DistanceScale=0.6
r.Shadow.CSM.TransitionScale=0
r.DistanceFieldShadowing=0

[ShadowQuality@1]
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.05
r.Shadow.DistanceScale=0.7
r.Shadow.CSM.TransitionScale=0.8
r.DistanceFieldShadowing=0

[ShadowQuality@2]
r.LightFunctionQuality=1
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.RadiusThreshold=0.04
r.Shadow.DistanceScale=0.85
r.Shadow.CSM.TransitionScale=1.0
r.DistanceFieldShadowing=0

[ShadowQuality@3]
r.LightFunctionQuality=1
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=3
r.Shadow.MaxResolution=2048
r.Shadow.MaxCSMResolution=2048
r.Shadow.RadiusThreshold=0.03
r.Shadow.DistanceScale=1.0
r.Shadow.CSM.TransitionScale=1.0
r.DistanceFieldShadowing=1

[ShadowQuality@Cine]
r.LightFunctionQuality=2
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=4
r.Shadow.MaxResolution=4096
r.Shadow.MaxCSMResolution=4096
r.Shadow.RadiusThreshold=0.01
r.Shadow.DistanceScale=1.2
r.Shadow.CSM.TransitionScale=1.0
r.DistanceFieldShadowing=1


